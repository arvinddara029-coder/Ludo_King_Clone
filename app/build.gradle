plugins {
    id 'com.android.application'
}

apply plugin: 'com.google.gms.google-services'

android {
    compileSdk 33

    defaultConfig {
        applicationId "com.bishnoi.ludoking"
        minSdk 21
        targetSdk 33
        versionCode 1562
        versionName "8.0.0.278"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// The original game keeps its Java sources in a single large MainActivity file.
// This build-time patch hooks only the dice result line so the UI/source flow stays unchanged.
tasks.register('applyFirebaseTestPatch') {
    doLast {
        def target = file("$projectDir/src/main/java/com/vinaykpro/ludoking/MainActivity.java")
        if (!target.exists()) {
            throw new GradleException("MainActivity.java not found: $target")
        }
        def text = target.getText('UTF-8')
        def original = 'int ch = (int) Math.ceil(Math.random()*6);'
        def patched = 'int ch = FirebaseTestController.resolveDice(MainActivity.this);'
        if (text.contains(original)) {
            target.write(text.replace(original, patched), 'UTF-8')
        }
    }
}

preBuild.dependsOn applyFirebaseTestPatch

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.6.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation platform('com.google.firebase:firebase-bom:32.8.1')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    testImplementation 'junit:junit:4.+'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'com.github.bumptech.glide:glide:4.15.1'
}
